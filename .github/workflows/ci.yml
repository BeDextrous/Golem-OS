name: CI

on:
  pull_request:
  workflow_call:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: golem-os-web
    env:
      # Placeholder values so the build can compile; no network calls are made at build time
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: golem-os-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

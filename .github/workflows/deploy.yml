name: Deploy to Vercel

# CLI-based deploy. Lets this repo stay PRIVATE inside the BeDextrous org,
# which Vercel's Hobby plan does not allow via the native Git integration.
# Requires repo secret: VERCEL_TOKEN

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: team_55pv3Q2uGRWHVdv4uobG3h88
  VERCEL_PROJECT_ID: prj_usXXX1LGvTLxUQE2wpbgG7HJfw95

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g vercel@latest
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
